# 全局设置：模型、数据源、成本、通知。
llm_provider: deepseek
deep_think_llm: deepseek-v4-pro       # 深度思考用强模型
quick_think_llm: deepseek-v4-flash    # 快速思考用快模型
backend_url: "https://api.deepseek.com/v1"   # DeepSeek OpenAI 兼容端点
max_debate_rounds: 1

# 数据源 vendor（默认全 yfinance，免费无 key，覆盖美股/A股/港股）
data_vendors:
  core_stock_apis: yfinance
  technical_indicators: yfinance
  fundamental_data: yfinance
  news_data: yfinance

cost_budget_usd_per_day: 5     # 当日累计成本超此值 → 健康告警

# 成本估算单价（美元 / 每百万 token）。token 数为真实统计，单价可按实际账单调整。
price_per_1m_input: 0.27       # DeepSeek 估算值，按实际调整
price_per_1m_output: 1.10

notify:
  channel: telegram            # 一期仅 telegram
  target: "telegram:shalow"    # hermes send --to 的目标
  enabled: true
