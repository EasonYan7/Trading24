<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 100vh;
  }

  .mention-menu {
    display: none;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
    overflow-y: auto;
    max-height: 240px;
    margin-bottom: 8px;
  }
  .mention-menu.open { display: block; }
  .mention-head {
    padding: 7px 11px;
    color: var(--subtle);
    font-size: 11px;
    border-bottom: 1px solid var(--border);
  }
  .mention-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 11px;
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    background: none;
    border: 0;
    color: var(--text);
    cursor: pointer;
  }
  .mention-item .sym { font-weight: 700; min-width: 72px; flex: 0 0 auto; }
  .mention-item .name { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mention-item .tag {
    flex: 0 0 auto;
    color: var(--primary);
    border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 10.5px;
    font-weight: 600;
  }
  .mention-item time { color: var(--subtle); font-size: 11px; flex: 0 0 auto; }
  .mention-item.selected, .mention-item:hover { background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .mention-item .chev { color: var(--subtle); flex: 0 0 auto; font-size: 12px; }
  .mention-item .check {
    flex: 0 0 auto; width: 15px; height: 15px; border-radius: 4px;
    border: 1.5px solid var(--border-strong); display: inline-flex;
    align-items: center; justify-content: center; font-size: 11px; line-height: 1;
    color: var(--primary-text); background: transparent;
  }
  .mention-item.checked .check { background: var(--primary); border-color: var(--primary); }
  .mention-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 11px; border-top: 1px solid var(--border);
    color: var(--subtle); font-size: 11px;
  }
  .mention-foot button {
    font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 8px; padding: 4px 12px;
    background: var(--primary); color: var(--primary-text);
  }
  .mention-foot button:disabled { opacity: .4; cursor: default; }

  .composer-box {
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--surface);
    padding: 7px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 7px;
    align-items: end;
  }
  .composer-box:focus-within { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); }

  textarea {
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    background: transparent;
    border: 0;
    outline: 0;
    resize: none;
    width: 100%;
    min-height: 38px;
    max-height: 108px;
    padding: 7px 5px;
  }
  textarea::placeholder { color: var(--subtle); }
  textarea:disabled { opacity: .55; }

  .send {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 10px;
    background: var(--primary);
    color: var(--primary-text);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .send:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--subtle); font-size: 10.5px; margin-top: 5px; }
</style>
</head>
<body>
  <div class="mention-menu" id="menu"></div>
  <form id="form">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder=""></textarea>
      <button class="send" id="send" type="submit" title="发送 (Enter)">↑</button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · @ 引用标的数据作为背景</div>
  </form>

<script>
(function () {
  "use strict";

  function post(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  function setFrameHeight(h) { post("streamlit:setFrameHeight", { height: h }); }
  function setValue(v) { post("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  const menu = document.getElementById("menu");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const form = document.getElementById("form");

  let stocks = [];        // [{sym, name, decision, age, tag, runs:[{date,decision,age,latest}]}]
  let items = [];         // 当前过滤结果（一级）
  let index = 0;
  let mentionStart = -1;
  let disabled = false;
  // 二级（决策多选）状态：drill=当前股票对象，checked=选中的 run 下标集合
  let drill = null;
  let checked = new Set();

  const BASE_H = 96;

  function syncHeight() {
    const menuH = menu.classList.contains("open") ? Math.min(menu.scrollHeight, 240) + 10 : 0;
    const inputH = Math.max(0, input.scrollHeight - 38);
    setFrameHeight(BASE_H + menuH + Math.min(inputH, 70));
    if (menuH) scrollHostToBottom();
  }

  function scrollHostToBottom() {
    try {
      const panel = window.parent.document.querySelector(".st-key-t24_ai_panel");
      if (panel) panel.scrollTop = panel.scrollHeight;
    } catch (e) { /* 跨域时忽略 */ }
  }

  function closeMenu() {
    menu.classList.remove("open");
    items = [];
    mentionStart = -1;
    drill = null;
    checked = new Set();
    syncHeight();
  }

  function renderMenu() {
    if (drill) { renderDrill(); return; }
    menu.innerHTML = "";
    const head = document.createElement("div");
    head.className = "mention-head";
    head.textContent = "选择标的(↑↓ 选择,Enter 进入决策列表)";
    menu.appendChild(head);
    items.forEach(function (s, i) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mention-item" + (i === index ? " selected" : "");
      const sym = document.createElement("span"); sym.className = "sym"; sym.textContent = s.sym;
      const name = document.createElement("span"); name.className = "name"; name.textContent = s.name + " · " + s.decision;
      btn.append(sym, name);
      if (s.tag) {
        const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = s.tag;
        btn.appendChild(tag);
      }
      const t = document.createElement("time"); t.textContent = s.age;
      btn.appendChild(t);
      const chev = document.createElement("span"); chev.className = "chev";
      chev.textContent = (s.runs && s.runs.length > 1) ? "› " + s.runs.length + " 条决策" : "›";
      btn.appendChild(chev);
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); enterDrill(s); });
      menu.appendChild(btn);
    });
    menu.classList.add("open");
    syncHeight();
  }

  function enterDrill(s) {
    if (!s.runs || s.runs.length <= 1) { pick(s.sym); return; }  // 只有一条决策：直接引用
    drill = s;
    checked = new Set();
    index = 0;
    renderDrill();
  }

  function renderDrill() {
    menu.innerHTML = "";
    const head = document.createElement("div");
    head.className = "mention-head";
    head.textContent = drill.sym + " · 选择决策(空格/点击 多选,Enter 确认,← 返回)";
    menu.appendChild(head);
    drill.runs.forEach(function (r, i) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mention-item" + (i === index ? " selected" : "") + (checked.has(i) ? " checked" : "");
      const box = document.createElement("span"); box.className = "check";
      box.textContent = checked.has(i) ? "✓" : "";
      const name = document.createElement("span"); name.className = "name";
      name.textContent = r.date + " · " + r.decision + (r.latest ? "（最新）" : "");
      btn.append(box, name);
      const t = document.createElement("time"); t.textContent = r.age;
      btn.appendChild(t);
      btn.addEventListener("mousedown", function (e) {
        e.preventDefault();
        if (checked.has(i)) checked.delete(i); else checked.add(i);
        index = i;
        renderDrill();
      });
      menu.appendChild(btn);
    });
    const foot = document.createElement("div");
    foot.className = "mention-foot";
    const info = document.createElement("span");
    info.textContent = checked.size ? ("已选 " + checked.size + " 条") : "未选=引用最新一条";
    const ok = document.createElement("button");
    ok.type = "button";
    ok.textContent = "确认";
    ok.addEventListener("mousedown", function (e) { e.preventDefault(); confirmDrill(); });
    foot.append(info, ok);
    menu.appendChild(foot);
    menu.classList.add("open");
    syncHeight();
  }

  function confirmDrill() {
    if (!drill) return;
    let tokens;
    if (!checked.size) {
      tokens = ["@" + drill.sym];               // 未选 = 引用最新
    } else {
      tokens = Array.from(checked).sort(function (a, b) { return a - b; })
        .map(function (i) {
          const r = drill.runs[i];
          return r.latest ? "@" + drill.sym : "@" + drill.sym + "(" + r.date + ")";
        });
    }
    insertTokens(tokens);
  }

  function updateMenu() {
    drill = null;  // 继续输入 → 退出二级，回到一级过滤
    checked = new Set();
    const caret = input.selectionStart;
    const before = input.value.slice(0, caret);
    const m = before.match(/@([A-Za-z0-9.一-龥]*)$/);
    if (!m) { closeMenu(); return; }
    const q = m[1].toLowerCase();
    mentionStart = caret - m[0].length;
    items = stocks.filter(function (s) {
      return s.sym.toLowerCase().includes(q) || (s.name || "").toLowerCase().includes(q);
    });
    if (!items.length) { closeMenu(); return; }
    index = Math.min(index, items.length - 1);
    renderMenu();
  }

  function pick(sym) { insertTokens(["@" + sym]); }

  function insertTokens(tokens) {
    const caret = input.selectionStart;
    const before = input.value.slice(0, mentionStart);
    const after = input.value.slice(caret);
    const inserted = tokens.join(" ") + " ";
    input.value = before + inserted + after;
    const pos = (before + inserted).length;
    input.setSelectionRange(pos, pos);
    closeMenu();
    input.focus();
  }

  function submit() {
    const text = input.value.trim();
    if (!text || disabled) return;
    input.value = "";
    closeMenu();
    setValue({ text: text, ts: Date.now() });
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); submit(); });

  input.addEventListener("input", function () { updateMenu(); syncHeight(); });
  input.addEventListener("click", updateMenu);

  input.addEventListener("keydown", function (e) {
    if (menu.classList.contains("open")) {
      const n = drill ? drill.runs.length : items.length;
      if (e.key === "ArrowDown") { e.preventDefault(); index = (index + 1) % n; renderMenu(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); index = (index - 1 + n) % n; renderMenu(); return; }
      if (drill) {
        if (e.key === " ") {  // 空格切换勾选
          e.preventDefault();
          if (checked.has(index)) checked.delete(index); else checked.add(index);
          renderDrill(); return;
        }
        if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); confirmDrill(); return; }
        if (e.key === "ArrowLeft" || e.key === "Backspace") {
          e.preventDefault(); drill = null; checked = new Set(); index = 0; renderMenu(); return;
        }
        if (e.key === "Escape") { closeMenu(); return; }
        return;
      }
      if (e.key === "Enter" || e.key === "Tab" || e.key === "ArrowRight") {
        e.preventDefault(); enterDrill(items[index]); return;
      }
      if (e.key === "Escape") { closeMenu(); return; }
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });

  window.addEventListener("message", function (e) {
    const data = e.data;
    if (!data || data.type !== "streamlit:render") return;
    const args = data.args || {};
    stocks = args.stocks || [];
    disabled = !!args.disabled;
    input.placeholder = args.placeholder || "问我关于这些分析的任何问题…";
    input.disabled = disabled;
    send.disabled = disabled;
    const th = args.theme || {};
    const root = document.body.style;
    root.setProperty("--surface", th.surface || "#141414");
    root.setProperty("--text", th.text || "#f3f0f1");
    root.setProperty("--muted", th.muted || "#a3a3a3");
    root.setProperty("--subtle", th.subtle || "#8f8f8f");
    root.setProperty("--border", th.border || "#262626");
    root.setProperty("--border-strong", th.border_strong || "#3f3f46");
    root.setProperty("--primary", th.primary || "#4edea3");
    root.setProperty("--primary-text", th.primary_text || "#002113");
    syncHeight();
  });

  post("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight(BASE_H);
})();
</script>
</body>
</html>
